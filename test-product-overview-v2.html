<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Product Overview Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0e27;
            font-family: system-ui, -apple-system, sans-serif;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
        .controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="navigateToSlide(0)">Title Slide</button>
        <button onclick="navigateToSlide(24)">Product Overview</button>
        <button onclick="navigateToSlide(85)">Unfair Advantages</button>
        <button onclick="refreshFrame()">Refresh</button>
        <span id="slide-number" style="color: white; margin-left: 10px;">Current: 24</span>
    </div>
    <iframe id="app-frame" src="http://localhost:5000/#/slide/24"></iframe>
    
    <script>
        function navigateToSlide(slideNumber) {
            const iframe = document.getElementById('app-frame');
            iframe.src = `http://localhost:5000/#/slide/${slideNumber}`;
            document.getElementById('slide-number').textContent = `Current: ${slideNumber}`;
        }
        
        function refreshFrame() {
            const iframe = document.getElementById('app-frame');
            iframe.src = iframe.src;
        }
        
        // Auto-navigate to slide 24 after load
        window.addEventListener('load', () => {
            setTimeout(() => {
                navigateToSlide(24);
            }, 1000);
        });
    </script>
</body>
</html>
