<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Features Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .log {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #333;
            white-space: pre-wrap;
        }
        .success { border-color: #4CAF50; color: #4CAF50; }
        .error { border-color: #f44336; color: #f44336; }
        .info { border-color: #2196F3; color: #2196F3; }
        button {
            margin: 5px;
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #1976D2; }
    </style>
</head>
<body>
    <h1>Export Features Test</h1>
    <div id="test-controls">
        <button onclick="testPDFExport()">Test PDF Export</button>
        <button onclick="testExportOptions()">Test Export Options Modal</button>
        <button onclick="testNavigation()">Test Navigation</button>
        <button onclick="testKeyboardShortcuts()">Test Keyboard Shortcuts</button>
        <button onclick="checkConsoleErrors()">Check Console Errors</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testPDFExport() {
            log('Testing PDF Export functionality...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Find Export PDF button
                const exportPDFBtn = appWindow.document.querySelector('button:has-text("Export PDF"), button[class*="export-pdf"]');
                
                if (exportPDFBtn) {
                    log('✓ Export PDF button found', 'success');
                    
                    // Override print to capture the call
                    const originalPrint = appWindow.print;
                    let printCalled = false;
                    appWindow.print = function() {
                        printCalled = true;
                        log('✓ Print dialog triggered', 'success');
                        
                        // Check for print styles
                        const printStyles = appWindow.document.querySelectorAll('style, link[media="print"]');
                        if (printStyles.length > 0) {
                            log(`✓ Found ${printStyles.length} print style definitions`, 'success');
                        } else {
                            log('✗ No print styles found', 'error');
                        }
                        
                        // Check for slide elements in print mode
                        const printSlides = appWindow.document.querySelectorAll('.print-slide, [class*="slide"]');
                        log(`Found ${printSlides.length} slides for printing`, 'info');
                        
                        if (printSlides.length === 87) {
                            log('✓ All 87 slides detected for export', 'success');
                        } else if (printSlides.length === 1) {
                            log('✗ Only current slide detected for export', 'error');
                        } else {
                            log(`⚠ Unexpected number of slides: ${printSlides.length}`, 'error');
                        }
                    };
                    
                    exportPDFBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    if (!printCalled) {
                        log('✗ Print dialog not triggered', 'error');
                    }
                    
                    appWindow.print = originalPrint;
                } else {
                    log('✗ Export PDF button not found', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function testExportOptions() {
            log('Testing Export Options Modal...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Find Export Options button
                const exportOptionsBtn = appWindow.document.querySelector('button:has-text("Export Options"), button[class*="export-options"]');
                
                if (exportOptionsBtn) {
                    log('✓ Export Options button found', 'success');
                    
                    exportOptionsBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Check for modal
                    const modal = appWindow.document.querySelector('.export-dashboard, .modal, [role="dialog"], [class*="export"]');
                    
                    if (modal) {
                        log('✓ Export modal appeared', 'success');
                        
                        // Check for export options
                        const options = {
                            'PDF': modal.querySelector('button:has-text("PDF"), [class*="pdf"]'),
                            'PNG': modal.querySelector('button:has-text("PNG"), [class*="png"]'),
                            'ZIP': modal.querySelector('button:has-text("ZIP"), [class*="zip"]'),
                            'JSON': modal.querySelector('button:has-text("JSON"), [class*="json"]'),
                            'Close': modal.querySelector('button:has-text("Close"), [class*="close"]')
                        };
                        
                        for (const [name, element] of Object.entries(options)) {
                            if (element) {
                                log(`✓ ${name} option found`, 'success');
                            } else {
                                log(`✗ ${name} option not found`, 'error');
                            }
                        }
                        
                        // Test close button
                        if (options.Close) {
                            options.Close.click();
                            await new Promise(resolve => setTimeout(resolve, 500));
                            
                            const modalAfterClose = appWindow.document.querySelector('.export-dashboard:not(.hidden), .modal:not(.hidden)');
                            if (!modalAfterClose) {
                                log('✓ Modal closed successfully', 'success');
                            } else {
                                log('✗ Modal did not close', 'error');
                            }
                        }
                    } else {
                        log('✗ Export modal did not appear', 'error');
                    }
                } else {
                    log('✗ Export Options button not found', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function testNavigation() {
            log('Testing Navigation functionality...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Check current slide
                const getSlideNumber = () => {
                    const match = appWindow.location.hash.match(/slide\/(\d+)/);
                    return match ? parseInt(match[1]) : 0;
                };
                
                const initialSlide = getSlideNumber();
                log(`Starting on slide ${initialSlide}`, 'info');
                
                // Find navigation arrows
                const nextBtn = appWindow.document.querySelector('button[aria-label*="Next"], svg[class*="chevron-right"], button:has(svg[class*="right"])');
                const prevBtn = appWindow.document.querySelector('button[aria-label*="Previous"], svg[class*="chevron-left"], button:has(svg[class*="left"])');
                
                if (nextBtn) {
                    log('✓ Next button found', 'success');
                    nextBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    const afterNext = getSlideNumber();
                    if (afterNext === initialSlide + 1) {
                        log('✓ Navigation to next slide works', 'success');
                    } else {
                        log(`✗ Navigation failed: expected slide ${initialSlide + 1}, got ${afterNext}`, 'error');
                    }
                }
                
                if (prevBtn) {
                    log('✓ Previous button found', 'success');
                    prevBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    const afterPrev = getSlideNumber();
                    if (afterPrev === initialSlide) {
                        log('✓ Navigation to previous slide works', 'success');
                    } else {
                        log(`✗ Navigation failed: expected slide ${initialSlide}, got ${afterPrev}`, 'error');
                    }
                }
                
                // Test Act dropdown
                const actDropdown = appWindow.document.querySelector('[class*="act-dropdown"], select[class*="act"]');
                if (actDropdown) {
                    log('✓ Act dropdown found', 'success');
                } else {
                    log('✗ Act dropdown not found', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function testKeyboardShortcuts() {
            log('Testing Keyboard Shortcuts...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Enable Edit Mode first
                const editBtn = appWindow.document.querySelector('button:has-text("Edit Mode"), button[class*="edit"]');
                if (editBtn) {
                    editBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Test G key for grid
                    const gridKeyEvent = new appWindow.KeyboardEvent('keydown', {
                        key: 'g',
                        code: 'KeyG',
                        bubbles: true
                    });
                    appWindow.document.dispatchEvent(gridKeyEvent);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    const gridOverlay = appWindow.document.querySelector('.grid-overlay, [class*="grid"]');
                    if (gridOverlay) {
                        log('✓ Grid overlay appears with G key', 'success');
                    } else {
                        log('✗ Grid overlay does not appear with G key', 'error');
                    }
                    
                    // Test Ctrl+Z for undo
                    const undoKeyEvent = new appWindow.KeyboardEvent('keydown', {
                        key: 'z',
                        code: 'KeyZ',
                        ctrlKey: true,
                        bubbles: true
                    });
                    appWindow.document.dispatchEvent(undoKeyEvent);
                    log('Ctrl+Z pressed (undo)', 'info');
                    
                    // Test Ctrl+Shift+Z for redo
                    const redoKeyEvent = new appWindow.KeyboardEvent('keydown', {
                        key: 'z',
                        code: 'KeyZ',
                        ctrlKey: true,
                        shiftKey: true,
                        bubbles: true
                    });
                    appWindow.document.dispatchEvent(redoKeyEvent);
                    log('Ctrl+Shift+Z pressed (redo)', 'info');
                    
                    // Test Escape to exit edit mode
                    const escapeKeyEvent = new appWindow.KeyboardEvent('keydown', {
                        key: 'Escape',
                        code: 'Escape',
                        bubbles: true
                    });
                    appWindow.document.dispatchEvent(escapeKeyEvent);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    // Check if edit mode exited
                    const editBarAfterEscape = appWindow.document.querySelector('.edit-mode-bar.active');
                    if (!editBarAfterEscape) {
                        log('✓ Escape key exits edit mode', 'success');
                    } else {
                        log('✗ Escape key does not exit edit mode', 'error');
                    }
                } else {
                    log('✗ Could not enable Edit Mode for keyboard shortcut testing', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function checkConsoleErrors() {
            log('Checking Console Errors...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Capture console errors
                const errors = [];
                const warnings = [];
                
                const originalError = appWindow.console.error;
                const originalWarn = appWindow.console.warn;
                
                appWindow.console.error = function(...args) {
                    errors.push(args.join(' '));
                    originalError.apply(appWindow.console, args);
                };
                
                appWindow.console.warn = function(...args) {
                    warnings.push(args.join(' '));
                    originalWarn.apply(appWindow.console, args);
                };
                
                // Trigger some actions to generate potential errors
                const editBtn = appWindow.document.querySelector('button:has-text("Edit Mode"), button[class*="edit"]');
                if (editBtn) editBtn.click();
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Report findings
                log(`Found ${errors.length} console errors`, errors.length > 0 ? 'error' : 'success');
                errors.forEach(err => log(`ERROR: ${err}`, 'error'));
                
                log(`Found ${warnings.length} console warnings`, warnings.length > 0 ? 'error' : 'info');
                warnings.forEach(warn => log(`WARNING: ${warn}`, 'info'));
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
