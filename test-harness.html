<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation System Test Harness</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .test-section {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        
        .test-section h2 {
            color: #14b8a6;
            margin-top: 0;
            border-bottom: 2px solid #14b8a6;
            padding-bottom: 10px;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .test-button {
            background: #2a2a2a;
            color: #14b8a6;
            border: 1px solid #14b8a6;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .test-button:hover {
            background: #14b8a6;
            color: #0a0a0a;
            transform: translateY(-2px);
        }
        
        .result {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .success {
            color: #4ade80;
            border-color: #4ade80;
        }
        
        .error {
            color: #ef4444;
            border-color: #ef4444;
        }
        
        .warning {
            color: #fbbf24;
            border-color: #fbbf24;
        }
        
        .info {
            color: #60a5fa;
            border-color: #60a5fa;
        }
        
        iframe {
            width: 100%;
            height: 700px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #000;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #14b8a6;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 style="color: #14b8a6; text-align: center;">AI Family Office Presentation System Test Harness</h1>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="testCount">0</div>
                <div class="stat-label">Tests Run</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passCount">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failCount">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="warningCount">0</div>
                <div class="stat-label">Warnings</div>
            </div>
        </div>
        
        <!-- Application Frame -->
        <div class="test-section">
            <h2>Application Under Test</h2>
            <iframe id="appFrame" src="http://localhost:5000"></iframe>
        </div>
        
        <!-- Test Controls -->
        <div class="test-section">
            <h2>Test Suite Controls</h2>
            <div class="test-grid">
                <button class="test-button" onclick="runAllTests()">🚀 Run All Tests</button>
                <button class="test-button" onclick="runEditModeTests()">✏️ Edit Mode Tests</button>
                <button class="test-button" onclick="runExportTests()">📦 Export Tests</button>
                <button class="test-button" onclick="runPerformanceTests()">⚡ Performance Tests</button>
                <button class="test-button" onclick="clearResults()">🗑️ Clear Results</button>
                <button class="test-button" onclick="exportReport()">📊 Export Report</button>
            </div>
        </div>
        
        <!-- Individual Test Sections -->
        <div class="test-section">
            <h2>1. Edit Mode Testing</h2>
            <div class="test-grid">
                <button class="test-button" onclick="testEditModeToggle()">Toggle Edit Mode</button>
                <button class="test-button" onclick="testDragAndDrop()">Test Drag & Drop</button>
                <button class="test-button" onclick="testTextEditing()">Test Text Editing</button>
                <button class="test-button" onclick="testDeleteFunction()">Test Delete</button>
                <button class="test-button" onclick="testUndoRedo()">Test Undo/Redo</button>
                <button class="test-button" onclick="testSaveReset()">Test Save/Reset</button>
                <button class="test-button" onclick="testGridToggle()">Test Grid Toggle</button>
                <button class="test-button" onclick="testKeyboardShortcuts()">Test Shortcuts</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>2. Export Features Testing</h2>
            <div class="test-grid">
                <button class="test-button" onclick="testPDFExport()">Test PDF Export</button>
                <button class="test-button" onclick="testPNGExport()">Test PNG Export</button>
                <button class="test-button" onclick="testJSONExport()">Test JSON Export</button>
                <button class="test-button" onclick="testImportJSON()">Test JSON Import</button>
                <button class="test-button" onclick="testBulkExport()">Test Bulk Export</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>3. Navigation Testing</h2>
            <div class="test-grid">
                <button class="test-button" onclick="testSlideNavigation()">Test Slide Navigation</button>
                <button class="test-button" onclick="testKeyboardNav()">Test Keyboard Nav</button>
                <button class="test-button" onclick="navigateToSlide(9)">Go to Slide 9</button>
                <button class="test-button" onclick="navigateToSlide(0)">Go to First Slide</button>
                <button class="test-button" onclick="navigateToSlide(86)">Go to Last Slide</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>4. Edge Cases & Error Handling</h2>
            <div class="test-grid">
                <button class="test-button" onclick="testBoundaryConditions()">Test Boundaries</button>
                <button class="test-button" onclick="testInvalidInputs()">Test Invalid Inputs</button>
                <button class="test-button" onclick="testLocalStorageLimit()">Test Storage Limits</button>
                <button class="test-button" onclick="testConcurrentEdits()">Test Concurrent Edits</button>
            </div>
        </div>
        
        <!-- Test Results -->
        <div class="test-section">
            <h2>Test Results</h2>
            <div id="results" class="result"></div>
        </div>
    </div>

    <script>
        let testResults = [];
        let stats = {
            total: 0,
            passed: 0,
            failed: 0,
            warnings: 0
        };
        
        function updateStats() {
            document.getElementById('testCount').textContent = stats.total;
            document.getElementById('passCount').textContent = stats.passed;
            document.getElementById('failCount').textContent = stats.failed;
            document.getElementById('warningCount').textContent = stats.warnings;
        }
        
        function log(message, type = 'info') {
            const timestamp = new Date().toISOString();
            const logEntry = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            
            const resultDiv = document.getElementById('results');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = logEntry;
            resultDiv.appendChild(entry);
            
            testResults.push({ timestamp, type, message });
            
            stats.total++;
            if (type === 'success') stats.passed++;
            else if (type === 'error') stats.failed++;
            else if (type === 'warning') stats.warnings++;
            
            updateStats();
            
            // Scroll to bottom
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            testResults = [];
            stats = { total: 0, passed: 0, failed: 0, warnings: 0 };
            updateStats();
            log('Test results cleared', 'info');
        }
        
        async function getAppWindow() {
            return document.getElementById('appFrame').contentWindow;
        }
        
        async function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // Test Functions
        async function testEditModeToggle() {
            try {
                log('Testing Edit Mode Toggle...', 'info');
                const app = await getAppWindow();
                
                // Find edit mode button
                const editBtn = app.document.querySelector('.edit-mode-toggle');
                if (!editBtn) {
                    log('Edit Mode button not found', 'error');
                    return;
                }
                
                // Check initial state
                const initialActive = editBtn.classList.contains('active');
                log(`Initial state: ${initialActive ? 'Active' : 'Inactive'}`, 'info');
                
                // Toggle edit mode
                editBtn.click();
                await wait(500);
                
                const afterClick = editBtn.classList.contains('active');
                if (afterClick !== !initialActive) {
                    log('Edit Mode toggle failed', 'error');
                } else {
                    log('Edit Mode toggle successful', 'success');
                }
                
                // Check if edit bar appears
                const editBar = app.document.querySelector('.edit-controls');
                if (afterClick && !editBar) {
                    log('Edit controls bar did not appear', 'error');
                } else if (afterClick && editBar) {
                    log('Edit controls bar appeared correctly', 'success');
                }
                
                // Toggle back
                editBtn.click();
                await wait(500);
                
                const finalState = editBtn.classList.contains('active');
                if (finalState === initialActive) {
                    log('Edit Mode toggled back successfully', 'success');
                }
                
            } catch (error) {
                log(`Edit Mode Toggle Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testDragAndDrop() {
            try {
                log('Testing Drag and Drop functionality...', 'info');
                const app = await getAppWindow();
                
                // Navigate to slide 9 (ProductOverviewSlide)
                await navigateToSlide(9);
                await wait(1000);
                
                // Enable edit mode
                const editBtn = app.document.querySelector('.edit-mode-toggle');
                if (editBtn && !editBtn.classList.contains('active')) {
                    editBtn.click();
                    await wait(500);
                }
                
                // Find draggable elements
                const draggables = app.document.querySelectorAll('.editable-wrapper');
                log(`Found ${draggables.length} draggable elements`, 'info');
                
                if (draggables.length > 0) {
                    // Simulate drag on first element
                    const element = draggables[0];
                    const rect = element.getBoundingClientRect();
                    
                    // Create mouse events
                    const mouseDown = new app.MouseEvent('mousedown', {
                        clientX: rect.left + rect.width / 2,
                        clientY: rect.top + rect.height / 2,
                        bubbles: true
                    });
                    
                    const mouseMove = new app.MouseEvent('mousemove', {
                        clientX: rect.left + 100,
                        clientY: rect.top + 100,
                        bubbles: true
                    });
                    
                    const mouseUp = new app.MouseEvent('mouseup', {
                        clientX: rect.left + 100,
                        clientY: rect.top + 100,
                        bubbles: true
                    });
                    
                    element.dispatchEvent(mouseDown);
                    await wait(100);
                    app.document.dispatchEvent(mouseMove);
                    await wait(100);
                    app.document.dispatchEvent(mouseUp);
                    
                    log('Drag and drop simulation completed', 'success');
                } else {
                    log('No draggable elements found on slide 9', 'warning');
                }
                
            } catch (error) {
                log(`Drag and Drop Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testTextEditing() {
            try {
                log('Testing Text Editing functionality...', 'info');
                const app = await getAppWindow();
                
                // Enable edit mode
                const editBtn = app.document.querySelector('.edit-mode-toggle');
                if (editBtn && !editBtn.classList.contains('active')) {
                    editBtn.click();
                    await wait(500);
                }
                
                // Find text elements
                const editableTexts = app.document.querySelectorAll('.editable-wrapper');
                
                if (editableTexts.length > 0) {
                    const textElement = editableTexts[0];
                    
                    // Double-click to edit
                    const dblClick = new app.MouseEvent('dblclick', {
                        bubbles: true,
                        cancelable: true,
                        view: app
                    });
                    
                    textElement.dispatchEvent(dblClick);
                    await wait(500);
                    
                    // Check if edit input appeared
                    const editInput = textElement.querySelector('textarea, input');
                    if (editInput) {
                        log('Text edit mode activated successfully', 'success');
                        
                        // Type test text
                        editInput.value = 'Test Edit Content';
                        editInput.dispatchEvent(new app.Event('input', { bubbles: true }));
                        
                        // Save edit
                        editInput.blur();
                        await wait(500);
                        
                        log('Text editing completed', 'success');
                    } else {
                        log('Text edit input did not appear', 'warning');
                    }
                }
                
            } catch (error) {
                log(`Text Editing Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testUndoRedo() {
            try {
                log('Testing Undo/Redo functionality...', 'info');
                const app = await getAppWindow();
                
                // Find undo/redo buttons
                const undoBtn = app.document.querySelector('button[title*="Undo"]');
                const redoBtn = app.document.querySelector('button[title*="Redo"]');
                
                if (undoBtn && redoBtn) {
                    // Check initial state
                    const undoDisabled = undoBtn.disabled;
                    const redoDisabled = redoBtn.disabled;
                    
                    log(`Undo button: ${undoDisabled ? 'disabled' : 'enabled'}`, 'info');
                    log(`Redo button: ${redoDisabled ? 'disabled' : 'enabled'}`, 'info');
                    
                    // Test keyboard shortcuts
                    const ctrlZ = new app.KeyboardEvent('keydown', {
                        key: 'z',
                        ctrlKey: true,
                        bubbles: true
                    });
                    
                    app.dispatchEvent(ctrlZ);
                    await wait(200);
                    
                    log('Undo/Redo keyboard shortcuts tested', 'success');
                } else {
                    log('Undo/Redo buttons not found', 'warning');
                }
                
            } catch (error) {
                log(`Undo/Redo Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testSaveReset() {
            try {
                log('Testing Save/Reset functionality...', 'info');
                const app = await getAppWindow();
                
                // Find save and reset buttons
                const saveBtn = app.document.querySelector('button[title*="Save"]');
                const resetSlideBtn = app.document.querySelector('button[title*="Reset Current"]');
                const resetAllBtn = app.document.querySelector('button[title*="Reset All"]');
                
                if (saveBtn) {
                    // Click save
                    saveBtn.click();
                    await wait(500);
                    log('Save button clicked successfully', 'success');
                    
                    // Check localStorage
                    const savedContent = app.localStorage.getItem('slideEditableContent');
                    if (savedContent) {
                        log(`Content saved to localStorage (${savedContent.length} bytes)`, 'success');
                    } else {
                        log('No content found in localStorage', 'warning');
                    }
                }
                
                if (resetSlideBtn) {
                    log('Reset Slide button found', 'success');
                }
                
                if (resetAllBtn) {
                    log('Reset All button found', 'success');
                }
                
            } catch (error) {
                log(`Save/Reset Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testPDFExport() {
            try {
                log('Testing PDF Export functionality...', 'info');
                const app = await getAppWindow();
                
                // Find Export PDF button
                const exportPdfBtn = app.document.querySelector('button:has(.icon-file-text), button:has(.icon-download), [title*="Export PDF"], button:has(span:contains("Export PDF"))');
                
                if (exportPdfBtn) {
                    log('PDF Export button found', 'success');
                    
                    // Check if print styles are present
                    const printStyles = app.document.querySelector('style[media="print"]');
                    if (printStyles) {
                        log('Print styles detected', 'success');
                    } else {
                        log('No print-specific styles found', 'warning');
                    }
                    
                    // We can't actually trigger print dialog in automated test
                    log('PDF Export button present and accessible', 'success');
                } else {
                    log('PDF Export button not found', 'error');
                }
                
            } catch (error) {
                log(`PDF Export Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testPNGExport() {
            try {
                log('Testing PNG Export functionality...', 'info');
                const app = await getAppWindow();
                
                // Find Export Options button
                const exportOptionsBtn = app.document.querySelector('button:has(span:contains("Export Options")), [title*="Export Options"]');
                
                if (exportOptionsBtn) {
                    exportOptionsBtn.click();
                    await wait(500);
                    
                    // Check if export modal appeared
                    const exportModal = app.document.querySelector('.export-dashboard, .export-modal');
                    if (exportModal) {
                        log('Export Options modal opened successfully', 'success');
                        
                        // Check for PNG export option
                        const pngOption = exportModal.querySelector('button:contains("PNG"), button:contains("Images")');
                        if (pngOption) {
                            log('PNG export option available', 'success');
                        }
                        
                        // Close modal
                        const closeBtn = exportModal.querySelector('button:has(.icon-x), button:contains("Close")');
                        if (closeBtn) closeBtn.click();
                    } else {
                        log('Export Options modal did not open', 'warning');
                    }
                } else {
                    log('Export Options button not found', 'error');
                }
                
            } catch (error) {
                log(`PNG Export Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testJSONExport() {
            try {
                log('Testing JSON Export/Import functionality...', 'info');
                const app = await getAppWindow();
                
                // Find Export button in edit mode
                const exportBtn = app.document.querySelector('button[title*="Export Edits"]');
                const importBtn = app.document.querySelector('button[title*="Import Edits"]');
                
                if (exportBtn) {
                    log('JSON Export button found', 'success');
                }
                
                if (importBtn) {
                    log('JSON Import button found', 'success');
                }
                
                if (!exportBtn && !importBtn) {
                    log('JSON Export/Import buttons not found - may need Edit Mode', 'warning');
                }
                
            } catch (error) {
                log(`JSON Export Test Error: ${error.message}`, 'error');
            }
        }
        
        async function testGridToggle() {
            try {
                log('Testing Grid Toggle functionality...', 'info');
                const app = await getAppWindow();
                
                // Find grid toggle button
                const gridBtn = app.document.querySelector('button[title*="Grid"]');
                
                if (gridBtn) {
                    const initialState = gridBtn.classList.contains('active');
                    
                    // Toggle grid
                    gridBtn.click();
                    await wait(200);
                    
                    const afterState = gridBtn.classList.contains('active');
                    if (afterState !== initialState) {
                        log('Grid toggle successful', 'success');
                    }
                    
                    // Test keyboard shortcut
                    const gKey = new app.KeyboardEvent('keydown', {
                        key: 'g',
                        bubbles: true
                    });
                    
                    app.dispatchEvent(gKey);
                    await wait(200);
                    
                    log('Grid keyboard shortcut (G) tested', 'success');
                } else {
                    log('Grid toggle button not found', 'warning');
                }
                
            } catch (error) {
                log(`Grid Toggle Test Error: ${error.message}`, 'error');
            }
        }
        
        async function navigateToSlide(slideNumber) {
            try {
                const app = await getAppWindow();
                app.location.hash = `#/slide/${slideNumber}`;
                await wait(1000);
                log(`Navigated to slide ${slideNumber}`, 'info');
            } catch (error) {
                log(`Navigation Error: ${error.message}`, 'error');
            }
        }
        
        async function testSlideNavigation() {
            try {
                log('Testing slide navigation...', 'info');
                const app = await getAppWindow();
                
                // Test navigation to different slides
                const testSlides = [0, 9, 45, 86];
                
                for (const slide of testSlides) {
                    await navigateToSlide(slide);
                    await wait(500);
                    
                    // Check if slide loaded
                    const currentSlide = app.location.hash.match(/slide\/(\d+)/);
                    if (currentSlide && parseInt(currentSlide[1]) === slide) {
                        log(`Successfully navigated to slide ${slide}`, 'success');
                    } else {
                        log(`Failed to navigate to slide ${slide}`, 'error');
                    }
                }
                
                // Test arrow key navigation
                const rightArrow = new app.KeyboardEvent('keydown', {
                    key: 'ArrowRight',
                    bubbles: true
                });
                
                const leftArrow = new app.KeyboardEvent('keydown', {
                    key: 'ArrowLeft',
                    bubbles: true
                });
                
                app.dispatchEvent(rightArrow);
                await wait(500);
                log('Right arrow navigation tested', 'success');
                
                app.dispatchEvent(leftArrow);
                await wait(500);
                log('Left arrow navigation tested', 'success');
                
            } catch (error) {
                log(`Navigation Test Error: ${error.message}`, 'error');
            }
        }
        
        async function runAllTests() {
            log('Starting comprehensive test suite...', 'info');
            clearResults();
            
            await testEditModeToggle();
            await wait(1000);
            
            await testDragAndDrop();
            await wait(1000);
            
            await testTextEditing();
            await wait(1000);
            
            await testUndoRedo();
            await wait(1000);
            
            await testSaveReset();
            await wait(1000);
            
            await testGridToggle();
            await wait(1000);
            
            await testPDFExport();
            await wait(1000);
            
            await testPNGExport();
            await wait(1000);
            
            await testJSONExport();
            await wait(1000);
            
            await testSlideNavigation();
            
            log('All tests completed!', 'info');
            log(`Summary: ${stats.passed} passed, ${stats.failed} failed, ${stats.warnings} warnings`, 'info');
        }
        
        async function exportReport() {
            const report = {
                timestamp: new Date().toISOString(),
                stats: stats,
                results: testResults
            };
            
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-report-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            log('Test report exported', 'success');
        }
        
        // Auto-run basic check on load
        window.onload = () => {
            setTimeout(() => {
                log('Test harness loaded successfully', 'success');
                log('Application frame ready', 'info');
            }, 2000);
        };
    </script>
</body>
</html>
