<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manual Button Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #1a1a1a;
      color: white;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      background: #14b8a6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #10a190;
    }
    .result {
      margin-top: 20px;
      padding: 20px;
      background: #2a2a2a;
      border-radius: 8px;
      border: 1px solid #3a3a3a;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Button Testing for AI Family Office</h1>
  
  <div>
    <button onclick="testEditMode()">Test Edit Mode</button>
    <button onclick="testExportPDF()">Test Export PDF</button>
    <button onclick="testExportOptions()">Test Export Options</button>
  </div>
  
  <div class="result" id="result"></div>
  
  <iframe id="app" src="http://localhost:5000" style="margin-top: 20px;"></iframe>
  
  <script>
    function log(message) {
      const result = document.getElementById('result');
      result.innerHTML += message + '<br>';
      console.log(message);
    }
    
    function getIframeDocument() {
      const iframe = document.getElementById('app');
      return iframe.contentDocument || iframe.contentWindow.document;
    }
    
    function testEditMode() {
      log('--- Testing Edit Mode ---');
      const doc = getIframeDocument();
      
      // Find the Edit Mode button
      const buttons = Array.from(doc.querySelectorAll('button'));
      const editButton = buttons.find(btn => btn.textContent.includes('Edit Mode'));
      
      if (editButton) {
        log('Found Edit Mode button: ' + editButton.textContent);
        
        // Get initial state
        const initialText = editButton.textContent;
        const initialColor = window.getComputedStyle(editButton).color;
        
        // Click the button
        editButton.click();
        log('Clicked Edit Mode button');
        
        // Check after a delay
        setTimeout(() => {
          const newText = editButton.textContent;
          const newColor = window.getComputedStyle(editButton).color;
          
          log('Button text changed: ' + (initialText !== newText ? 'YES' : 'NO'));
          log('New button text: ' + newText);
          
          // Check if EditModeBar appeared
          const editModeBar = doc.querySelector('.edit-mode-bar');
          if (editModeBar) {
            log('✅ SUCCESS: EditModeBar is now visible!');
            log('EditModeBar classes: ' + editModeBar.className);
          } else {
            log('❌ FAILED: EditModeBar did not appear');
            
            // Look for any element with edit in the class
            const editElements = doc.querySelectorAll('[class*="edit"]');
            log('Found ' + editElements.length + ' elements with "edit" in class');
            editElements.forEach(el => {
              log('  - ' + el.className);
            });
          }
          
          // Check console for our debug logs
          const consoleLogs = iframe.contentWindow.console;
          log('Check browser console for debug logs');
        }, 500);
      } else {
        log('❌ Edit Mode button not found');
      }
    }
    
    function testExportPDF() {
      log('--- Testing Export PDF ---');
      const doc = getIframeDocument();
      
      const buttons = Array.from(doc.querySelectorAll('button'));
      const exportButton = buttons.find(btn => btn.textContent.includes('Export PDF'));
      
      if (exportButton) {
        log('Found Export PDF button: ' + exportButton.textContent);
        
        // Override window.print to detect if it's called
        const iframe = document.getElementById('app');
        const originalPrint = iframe.contentWindow.print;
        let printCalled = false;
        
        iframe.contentWindow.print = function() {
          printCalled = true;
          log('✅ SUCCESS: window.print() was called');
          
          // Check for print-only slides
          const printOnlySlides = doc.querySelector('.print-only-slides');
          if (printOnlySlides) {
            const slides = printOnlySlides.querySelectorAll('.print-slide');
            log('Found ' + slides.length + ' slides in print-only section');
          } else {
            log('❌ No print-only-slides section found');
          }
          
          // Restore original print function
          iframe.contentWindow.print = originalPrint;
        };
        
        exportButton.click();
        log('Clicked Export PDF button');
        
        setTimeout(() => {
          if (!printCalled) {
            log('❌ FAILED: window.print() was not called');
          }
        }, 500);
      } else {
        log('❌ Export PDF button not found');
      }
    }
    
    function testExportOptions() {
      log('--- Testing Export Options ---');
      const doc = getIframeDocument();
      
      const buttons = Array.from(doc.querySelectorAll('button'));
      const exportButton = buttons.find(btn => btn.textContent.includes('Export Options'));
      
      if (exportButton) {
        log('Found Export Options button: ' + exportButton.textContent);
        
        // Click the button
        exportButton.click();
        log('Clicked Export Options button');
        
        // Check after a delay
        setTimeout(() => {
          // Look for ExportDashboard
          const exportDashboard = doc.querySelector('.export-dashboard-overlay, .export-dashboard');
          if (exportDashboard) {
            log('✅ SUCCESS: Export Dashboard is now visible!');
            log('Export Dashboard classes: ' + exportDashboard.className);
            
            // Check what's inside
            const title = exportDashboard.querySelector('h2, h1, .title');
            if (title) {
              log('Dashboard title: ' + title.textContent);
            }
          } else {
            log('❌ FAILED: Export Dashboard did not appear');
            
            // Look for any modal elements
            const modals = doc.querySelectorAll('[class*="modal"], [class*="dashboard"], [class*="overlay"]');
            log('Found ' + modals.length + ' potential modal elements');
            modals.forEach(el => {
              log('  - ' + el.className);
            });
          }
        }, 500);
      } else {
        log('❌ Export Options button not found');
      }
    }
    
    // Wait for iframe to load
    window.addEventListener('load', () => {
      setTimeout(() => {
        log('Test harness ready. Click the buttons above to test each feature.');
      }, 2000);
    });
  </script>
</body>
</html>
