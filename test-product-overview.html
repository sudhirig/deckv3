<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductOverviewSlide Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        
        /* Viewport container with 16:9 aspect ratio */
        .slide-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
        }
        
        /* 16:9 slide container */
        .slide-container {
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 8px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        #root {
            width: 100%;
            height: 100%;
        }
        
        /* Glass card styles */
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        
        /* Animation keyframes */
        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                opacity: 1;
            }
        }
        
        /* Debug info */
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="slide-viewport">
        <div class="slide-container">
            <div id="root"></div>
        </div>
    </div>
    
    <div class="debug-info">
        <div>Slide: ProductOverviewSlide</div>
        <div>Index: 85</div>
        <div id="element-count">Elements: Loading...</div>
        <div id="viewport-size">Viewport: Loading...</div>
    </div>
    
    <script type="module">
        // Direct navigation to slide 85 (ProductOverviewSlide)
        window.location.hash = '#/slide/85';
        
        // Debug info
        setTimeout(() => {
            const modules = document.querySelectorAll('.glass-card');
            document.getElementById('element-count').textContent = `Elements: ${modules.length} glass-cards found`;
            
            const container = document.querySelector('.slide-container');
            if (container) {
                const rect = container.getBoundingClientRect();
                document.getElementById('viewport-size').textContent = `Viewport: ${Math.round(rect.width)}x${Math.round(rect.height)}`;
            }
            
            // Check for overflow
            const slideContent = document.querySelector('#root > div');
            if (slideContent) {
                const contentHeight = slideContent.scrollHeight;
                const containerHeight = slideContent.clientHeight;
                if (contentHeight > containerHeight) {
                    console.warn('Content overflow detected:', contentHeight, '>', containerHeight);
                }
            }
        }, 2000);
    </script>
    
    <!-- Load the React app -->
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
