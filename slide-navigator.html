<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Navigator</title>
    <script>
        // Immediately navigate to the slide specified in the URL parameter
        const params = new URLSearchParams(window.location.search);
        const slideNum = params.get('slide') || '0';
        window.location.href = `http://localhost:5000/#/slide/${slideNum}`;
    </script>
</head>
<body>
    <h1>Navigating to slide...</h1>
</body>
</html>
