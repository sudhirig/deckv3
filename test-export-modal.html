<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Export Modal</title>
</head>
<body>
    <h1>Export Modal Test</h1>
    <p>Testing export functionality with ProductOverviewSlide</p>
    
    <iframe 
        src="http://localhost:5000/#/slide/9" 
        width="100%" 
        height="800px"
        style="border: 1px solid #ccc;">
    </iframe>
    
    <script>
        // Navigate to ProductOverviewSlide and open export modal
        setTimeout(() => {
            const iframe = document.querySelector('iframe');
            if (iframe && iframe.contentWindow) {
                // Navigate to slide 10 (index 9)
                iframe.contentWindow.location.hash = '/slide/9';
                
                // Wait a bit then try to click the Export Options button
                setTimeout(() => {
                    const exportBtn = iframe.contentDocument.querySelector('button');
                    const buttons = iframe.contentDocument.querySelectorAll('button');
                    buttons.forEach(btn => {
                        if (btn.textContent.includes('Export Options')) {
                            console.log('Found Export Options button, clicking...');
                            btn.click();
                        }
                    });
                }, 2000);
            }
        }, 1000);
    </script>
</body>
</html>
