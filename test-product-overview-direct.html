<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Product Overview Slide</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="http://localhost:5000/#/slide/85?static=1" id="slideFrame"></iframe>
    <script>
        // Force navigation to slide 85 after load
        setTimeout(() => {
            const iframe = document.getElementById('slideFrame');
            iframe.src = 'http://localhost:5000/#/slide/85?static=1';
        }, 2000);
    </script>
</body>
</html>
