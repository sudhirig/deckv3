<!DOCTYPE html>
<html>
<head>
    <title>Slide Layout Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #fff;
        }
        .controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #333;
            padding: 10px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 8px 16px;
            background: #4a90e2;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #357abd;
        }
        button.active {
            background: #2ecc71;
        }
        iframe {
            position: fixed;
            top: 80px;
            left: 0;
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
        }
        .status {
            margin-left: auto;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
            min-width: 200px;
            text-align: center;
        }
        .success { background: #27ae60 !important; }
        .error { background: #e74c3c !important; }
        .info-line {
            width: 100%;
            font-size: 12px;
            color: #aaa;
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="goToSlide(0)" id="btn-0">Title (0)</button>
        <button onclick="goToSlide(1)" id="btn-1">Executive Summary (1)</button>
        <button onclick="goToSlide(3)" id="btn-3">Act 1 (3)</button>
        <button onclick="goToSlide(4)" id="btn-4">Stanford Study (4)</button>
        <button onclick="goToSlide(87)" id="btn-87">Agentic AI Features (87)</button>
        <div class="status" id="status">Ready</div>
        <div class="info-line">Navigate between slides to test if content fits within viewport without scrolling</div>
    </div>
    
    <iframe id="slideFrame" src="http://localhost:5000/#/slide/0"></iframe>
    
    <script>
        let currentSlide = 0;
        
        function goToSlide(slideNumber) {
            const iframe = document.getElementById('slideFrame');
            const status = document.getElementById('status');
            
            // Update active button
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${slideNumber}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            // Navigate to slide
            iframe.src = `http://localhost:5000/#/slide/${slideNumber}`;
            currentSlide = slideNumber;
            
            status.textContent = `Loading Slide ${slideNumber}...`;
            status.className = 'status';
            
            // Check for overflow after loading
            setTimeout(() => {
                checkOverflow(slideNumber);
            }, 2000);
        }
        
        function checkOverflow(slideNumber) {
            const status = document.getElementById('status');
            try {
                const iframe = document.getElementById('slideFrame');
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Check for any element with overflow
                const body = iframeDoc.body;
                const hasVerticalScroll = body.scrollHeight > body.clientHeight;
                const hasHorizontalScroll = body.scrollWidth > body.clientWidth;
                
                // Also check viewport stage specifically
                const viewportStage = iframeDoc.querySelector('.slide-viewport-stage');
                let stageOverflow = false;
                if (viewportStage) {
                    stageOverflow = viewportStage.scrollHeight > viewportStage.clientHeight ||
                                  viewportStage.scrollWidth > viewportStage.clientWidth;
                }
                
                if (hasVerticalScroll || hasHorizontalScroll || stageOverflow) {
                    status.textContent = `Slide ${slideNumber}: OVERFLOW DETECTED!`;
                    status.className = 'status error';
                } else {
                    status.textContent = `Slide ${slideNumber}: ✓ Fits perfectly`;
                    status.className = 'status success';
                }
            } catch(e) {
                status.textContent = `Slide ${slideNumber} loaded`;
                status.className = 'status';
            }
        }
        
        // Start with title slide
        goToSlide(0);
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const slides = [0, 1, 3, 4, 87];
            const currentIndex = slides.indexOf(currentSlide);
            
            if (e.key === 'ArrowRight' && currentIndex < slides.length - 1) {
                goToSlide(slides[currentIndex + 1]);
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                goToSlide(slides[currentIndex - 1]);
            }
        });
    </script>
</body>
</html>
