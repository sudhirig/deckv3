<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mode Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .log {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #333;
            white-space: pre-wrap;
        }
        .success { border-color: #4CAF50; color: #4CAF50; }
        .error { border-color: #f44336; color: #f44336; }
        .info { border-color: #2196F3; color: #2196F3; }
        button {
            margin: 5px;
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #1976D2; }
    </style>
</head>
<body>
    <h1>Edit Mode Functionality Test</h1>
    <div id="test-controls">
        <button onclick="testEditModeToggle()">Test Edit Mode Toggle</button>
        <button onclick="testEditModeBarVisibility()">Test EditModeBar Visibility</button>
        <button onclick="testDragAndDrop()">Test Drag & Drop</button>
        <button onclick="testTextEditing()">Test Text Editing</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    <div id="logs"></div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testEditModeToggle() {
            log('Starting Edit Mode Toggle Test...', 'info');
            
            try {
                // Navigate to the app
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Find Edit Mode button
                const editBtn = appWindow.document.querySelector('button:has-text("Edit Mode"), button[class*="edit"]');
                
                if (editBtn) {
                    log('✓ Edit Mode button found', 'success');
                    
                    // Check initial state
                    const initialClass = editBtn.className;
                    const initialText = editBtn.textContent;
                    log(`Initial state - Classes: ${initialClass}, Text: ${initialText}`, 'info');
                    
                    // Click the button
                    editBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Check after click
                    const afterClass = editBtn.className;
                    const afterText = editBtn.textContent;
                    log(`After click - Classes: ${afterClass}, Text: ${afterText}`, 'info');
                    
                    // Check if EditModeBar appeared
                    const editBar = appWindow.document.querySelector('.edit-mode-bar, [class*="EditModeBar"]');
                    if (editBar && editBar.classList.contains('active')) {
                        log('✓ EditModeBar is visible and active', 'success');
                    } else {
                        log('✗ EditModeBar not visible or not active', 'error');
                    }
                    
                } else {
                    log('✗ Edit Mode button not found', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function testEditModeBarVisibility() {
            log('Testing EditModeBar Controls...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Enable edit mode
                const editBtn = appWindow.document.querySelector('button:has-text("Edit Mode"), button[class*="edit"]');
                if (editBtn) {
                    editBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Check for edit controls
                    const controls = {
                        'Undo': appWindow.document.querySelector('button[title*="Undo"]'),
                        'Redo': appWindow.document.querySelector('button[title*="Redo"]'),
                        'Grid': appWindow.document.querySelector('button[title*="Grid"]'),
                        'Save': appWindow.document.querySelector('button:has-text("Save")'),
                        'Reset Slide': appWindow.document.querySelector('button:has-text("Reset Slide")'),
                        'Reset All': appWindow.document.querySelector('button:has-text("Reset All")'),
                        'Export': appWindow.document.querySelector('button:has-text("Export")'),
                        'Import': appWindow.document.querySelector('button:has-text("Import")')
                    };
                    
                    for (const [name, element] of Object.entries(controls)) {
                        if (element) {
                            log(`✓ ${name} button found`, 'success');
                        } else {
                            log(`✗ ${name} button not found`, 'error');
                        }
                    }
                } else {
                    log('✗ Could not enable Edit Mode', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function testDragAndDrop() {
            log('Testing Drag & Drop functionality...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Enable edit mode
                const editBtn = appWindow.document.querySelector('button:has-text("Edit Mode"), button[class*="edit"]');
                if (editBtn) {
                    editBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Find draggable elements
                    const draggables = appWindow.document.querySelectorAll('.editable-wrapper, [draggable="true"]');
                    
                    if (draggables.length > 0) {
                        log(`✓ Found ${draggables.length} potentially draggable elements`, 'success');
                        
                        // Test first draggable
                        const element = draggables[0];
                        const initialTransform = element.style.transform;
                        
                        // Simulate drag
                        const mouseDown = new appWindow.MouseEvent('mousedown', {
                            bubbles: true,
                            cancelable: true,
                            clientX: 100,
                            clientY: 100
                        });
                        element.dispatchEvent(mouseDown);
                        
                        const mouseMove = new appWindow.MouseEvent('mousemove', {
                            bubbles: true,
                            cancelable: true,
                            clientX: 200,
                            clientY: 200
                        });
                        appWindow.document.dispatchEvent(mouseMove);
                        
                        const mouseUp = new appWindow.MouseEvent('mouseup', {
                            bubbles: true,
                            cancelable: true
                        });
                        appWindow.document.dispatchEvent(mouseUp);
                        
                        await new Promise(resolve => setTimeout(resolve, 500));
                        
                        const afterTransform = element.style.transform;
                        if (initialTransform !== afterTransform) {
                            log('✓ Element position changed after drag', 'success');
                        } else {
                            log('✗ Element position unchanged after drag', 'error');
                        }
                    } else {
                        log('✗ No draggable elements found', 'error');
                    }
                } else {
                    log('✗ Could not enable Edit Mode', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function testTextEditing() {
            log('Testing Text Editing functionality...', 'info');
            
            try {
                const appWindow = window.open('http://localhost:5000', 'app', 'width=1400,height=900');
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                // Enable edit mode
                const editBtn = appWindow.document.querySelector('button:has-text("Edit Mode"), button[class*="edit"]');
                if (editBtn) {
                    editBtn.click();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Find editable text elements
                    const editableTexts = appWindow.document.querySelectorAll('.editable-wrapper h1, .editable-wrapper p');
                    
                    if (editableTexts.length > 0) {
                        log(`✓ Found ${editableTexts.length} text elements`, 'success');
                        
                        // Double-click first element
                        const element = editableTexts[0];
                        const dblClick = new appWindow.MouseEvent('dblclick', {
                            bubbles: true,
                            cancelable: true
                        });
                        element.dispatchEvent(dblClick);
                        
                        await new Promise(resolve => setTimeout(resolve, 500));
                        
                        // Check for input/textarea
                        const editInput = appWindow.document.querySelector('input[type="text"], textarea, [contenteditable="true"]');
                        
                        if (editInput) {
                            log('✓ Text edit interface appeared', 'success');
                        } else {
                            log('✗ No text edit interface found', 'error');
                        }
                    } else {
                        log('✗ No editable text elements found', 'error');
                    }
                } else {
                    log('✗ Could not enable Edit Mode', 'error');
                }
                
                appWindow.close();
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
