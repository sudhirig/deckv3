<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Edit Mode Click</title>
</head>
<body>
  <h1>Testing Edit Mode Button Click</h1>
  <iframe id="app" src="http://localhost:5000" width="100%" height="600" style="border: 1px solid #ccc;"></iframe>
  
  <script>
    setTimeout(() => {
      const iframe = document.getElementById('app');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      
      // Find the Edit Mode button
      const editButton = Array.from(iframeDoc.querySelectorAll('button')).find(btn => 
        btn.textContent.includes('Edit Mode')
      );
      
      if (editButton) {
        console.log('Found Edit Mode button:', editButton);
        console.log('Button text before click:', editButton.textContent);
        
        // Click the button
        editButton.click();
        console.log('Clicked Edit Mode button');
        
        // Check if the button text changed after a short delay
        setTimeout(() => {
          console.log('Button text after click:', editButton.textContent);
          
          // Check if EditModeBar appeared
          const editModeBar = iframeDoc.querySelector('.edit-mode-bar');
          if (editModeBar) {
            console.log('EditModeBar is now visible!');
          } else {
            console.log('EditModeBar did not appear');
          }
        }, 500);
      } else {
        console.log('Edit Mode button not found');
      }
    }, 3000);
  </script>
</body>
</html>
